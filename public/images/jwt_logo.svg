<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JWT logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="badge">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
    <polygon id="hex" points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"/>
  </defs>

  <!-- black badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#000000"/>

  <!-- subtle hexagon texture -->
  <g clip-path="url(#badge)" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2">
    <use href="#hex" x="400" y="90"/>
    <use href="#hex" x="469.3" y="90"/>
    <use href="#hex" x="434.6" y="150"/>
    <use href="#hex" x="503.9" y="150"/>
    <use href="#hex" x="60" y="430"/>
    <use href="#hex" x="129.3" y="430"/>
    <use href="#hex" x="94.6" y="490"/>
    <use href="#hex" x="25.4" y="490"/>
  </g>

  <!-- starburst emblem: 8 rays, vertical and horizontal axes left open -->
  <g transform="translate(256 190)" fill="#FFFFFF">
    <!-- outer rays (solid) -->
    <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(22.5)"/>
    <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(157.5)"/>
    <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(202.5)"/>
    <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(337.5)"/>
    <!-- inner rays (softer) -->
    <g fill-opacity="0.55">
      <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(67.5)"/>
      <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(112.5)"/>
      <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(247.5)"/>
      <rect x="-12" y="-100" width="24" height="54" rx="5" transform="rotate(292.5)"/>
    </g>
  </g>

  <!-- JWT wordmark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- J -->
    <path d="M165 330 V378 Q165 400 143 400 L137 400 Q115 400 115 378"/>
    <!-- W -->
    <path d="M191 330 L221 400 L251 345 L281 400 L311 330"/>
    <!-- T -->
    <path d="M337 330 H397 M367 330 V400"/>
  </g>
</svg>

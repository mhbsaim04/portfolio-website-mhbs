<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CRUD logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="badge">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
    <polygon id="hex" points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"/>
  </defs>

  <!-- black badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#000000"/>

  <!-- subtle hexagon texture -->
  <g clip-path="url(#badge)" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2">
    <use href="#hex" x="400" y="90"/>
    <use href="#hex" x="469.3" y="90"/>
    <use href="#hex" x="434.6" y="150"/>
    <use href="#hex" x="503.9" y="150"/>
    <use href="#hex" x="400" y="210"/>
    <use href="#hex" x="469.3" y="210"/>
    <use href="#hex" x="60" y="430"/>
    <use href="#hex" x="129.3" y="430"/>
    <use href="#hex" x="94.6" y="490"/>
    <use href="#hex" x="25.4" y="490"/>
  </g>

  <!-- concentric rings with soft glow -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="256" cy="256" r="196" stroke-opacity="0.12" stroke-width="14"/>
    <circle cx="256" cy="256" r="196" stroke-width="4"/>
    <circle cx="256" cy="256" r="104" stroke-opacity="0.12" stroke-width="12"/>
    <circle cx="256" cy="256" r="104" stroke-width="3"/>
  </g>

  <!-- CRUD letters in the center -->
  <g transform="translate(256 256) scale(0.4545) translate(-256 -345)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- C -->
    <path d="M142 300 Q142 290 125 290 L100 290 Q74 290 74 316 L74 374 Q74 400 100 400 L125 400 Q142 400 142 390"/>
    <!-- R -->
    <path d="M172 400 L172 290 L215 290 Q242 290 242 316 Q242 342 215 342 L172 342 M208 342 L242 400"/>
    <!-- U -->
    <path d="M270 290 L270 374 Q270 400 296 400 L314 400 Q340 400 340 374 L340 290"/>
    <!-- D -->
    <path d="M368 290 L398 290 Q438 290 438 345 Q438 400 398 400 L368 400 Z"/>
  </g>

  <!-- icons -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Create: pencil (top) -->
    <g transform="translate(256 106) scale(2.3) translate(-12 -12)">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      <path d="m15 5 4 4"/>
    </g>
    <!-- Delete: trash bin (left) -->
    <g transform="translate(106 256) scale(2.3) translate(-12 -12)">
      <path d="M3 6h18"/>
      <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
      <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
      <line x1="10" x2="10" y1="11" y2="17"/>
      <line x1="14" x2="14" y1="11" y2="17"/>
    </g>
    <!-- Read: open book (right) -->
    <g transform="translate(406 256) scale(2.3) translate(-12 -12)">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </g>
    <!-- Update: monitor (bottom) -->
    <g transform="translate(256 406) scale(2.3) translate(-12 -12)">
      <rect width="20" height="14" x="2" y="3" rx="2"/>
      <line x1="8" x2="16" y1="21" y2="21"/>
      <line x1="12" x2="12" y1="17" y2="21"/>
    </g>
  </g>
</svg>
